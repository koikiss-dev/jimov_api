services:
  api:
    build: .
    image: jimov-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
